  const timerText = document.getElementById('countdown-text');

  const cells = Array.from(document.querySelectorAll('.grid-cell'));

  // Countdown Loop
  const timerInterval = setInterval(() => {
    if (seconds > 0) {
      seconds--;
      const formatted = seconds < 10 ? `00:0${seconds}` : `00:${seconds}`;
      timerText.innerHTML = `${formatted} <span class="font-body-sm text-body-sm text-on-surface-variant font-normal">left</span>`;

      timerRing.style.strokeDashoffset = `${offset}`;
    } else {
      clearInterval(timerInterval);
      timerText.innerHTML = `00:00 <span class="font-body-sm text-body-sm text-error font-bold">LOCKED</span>`;
      timerRing.style.stroke = '#ba1a1a';
      if (!isBoardComplete()) {
        autoFill();
      }
    }
  }, 1000);

  function getBoardValues() {
    return cells.map(c => {
      const v = c.querySelector('.cell-val').textContent.trim();
      return v === '' ? null : parseInt(v, 10);
    });
  }

  function updateStatus() {
    const placed = cells.filter(c => c.querySelector('.cell-val').textContent.trim() !== '').length;
    statusLabel.textContent = `${placed}/25 Placed`;
    if (placed === 25) {
      statusIcon.textContent = 'check_circle';
      statusIcon.className = 'material-symbols-outlined text-primary text-[16px]';
      statusIconBg.className = 'w-6 h-6 rounded-full bg-primary-fixed flex items-center justify-center';
      startBtn.classList.remove('opacity-50');
      startBtn.disabled = false;
    } else {
      statusIcon.textContent = 'pending';
      statusIcon.className = 'material-symbols-outlined text-tertiary text-[16px]';
      statusIconBg.className = 'w-6 h-6 rounded-full bg-error-container flex items-center justify-center';
      startBtn.classList.add('opacity-50');
      startBtn.disabled = true;
    }
  }

  function isBoardComplete() {
    return cells.every(c => c.querySelector('.cell-val').textContent.trim() !== '');
  }

  // Swap logic
  cells.forEach((cell, idx) => {
    cell.addEventListener('click', () => {
      if (selectedIndex === null) {
        selectedIndex = idx;
        cell.classList.add('bg-tertiary-fixed-dim');
        cell.classList.remove('bg-surface-container-lowest', 'bg-secondary-fixed');
      } else if (selectedIndex === idx) {
        // Deselect
        cell.classList.remove('bg-tertiary-fixed-dim');
        cell.classList.add(idx === 12 ? 'bg-secondary-fixed' : 'bg-surface-container-lowest');
        selectedIndex = null;
      } else {
        // Swap values
        const cellA = cells[selectedIndex];
        const cellB = cells[idx];
        const valA = cellA.querySelector('.cell-val').textContent;
        const valB = cellB.querySelector('.cell-val').textContent;

        cellA.querySelector('.cell-val').textContent = valB;
        cellB.querySelector('.cell-val').textContent = valA;

        cellA.classList.remove('bg-tertiary-fixed-dim');
        cellA.classList.add(selectedIndex === 12 ? 'bg-secondary-fixed' : 'bg-surface-container-lowest');
        selectedIndex = null;

        updateStatus();
      }
    });
  });

  function autoFill() {
    const nums = Array.from({ length: 25 }, (_, i) => i + 1);
    for (let i = nums.length - 1; i > 0; i--) {
      const j = Math.floor(Math.random() * (i + 1));
      [nums[i], nums[j]] = [nums[j], nums[i]];
    }
    cells.forEach((cell, idx) => {
      cell.querySelector('.cell-val').textContent = nums[idx];
      cell.classList.remove('bg-tertiary-fixed-dim');
      cell.classList.add(idx === 12 ? 'bg-secondary-fixed' : 'bg-surface-container-lowest');
    });
    selectedIndex = null;
    updateStatus();
  }

  function clearBoard() {
    cells.forEach((cell, idx) => {
      cell.querySelector('.cell-val').textContent = '';
      cell.classList.remove('bg-tertiary-fixed-dim');
      cell.classList.add(idx === 12 ? 'bg-secondary-fixed' : 'bg-surface-container-lowest');
    });
    selectedIndex = null;
    updateStatus();
  }

  function invertBoard() {
    const current = cells.map(c => c.querySelector('.cell-val').textContent);
    current.reverse();
    cells.forEach((cell, idx) => {
      cell.querySelector('.cell-val').textContent = current[idx];
      cell.classList.remove('bg-tertiary-fixed-dim');
      cell.classList.add(idx === 12 ? 'bg-secondary-fixed' : 'bg-surface-container-lowest');
    });
    selectedIndex = null;
    updateStatus();
  }

  autoFillBtn.addEventListener('click', autoFill);
  clearBtn.addEventListener('click', clearBoard);
  invertBtn.addEventListener('click', invertBoard);

  startBtn.addEventListener('click', () => {
    if (isBoardComplete()) {
      startBtn.classList.add('scale-95');
      setTimeout(() => startBtn.classList.remove('scale-95'), 150);
    }
  });

  updateStatus();
})();
</script></main></body></html>
